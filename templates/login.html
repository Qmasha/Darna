<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darna - Login</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;display:grid;place-items:center;height:100vh;margin:0}
form{background:#fff;padding:2rem;border-radius:12px;width:320px;display:grid;gap:.8rem}
input,button{padding:.6rem;border-radius:8px;border:1px solid #cbd5e1;font-size:1rem}
button{background:#89cff0;color:#0b3954;font-weight:600;border:0;cursor:pointer}button:hover{background:#6bbfe8}.err{color:#b91c1c;font-size:.9rem}</style></head>
<body><form method="post"><h2 style="margin:0">Darna</h2><small>Intelligent Property Maintenance &amp; Security</small>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<input name="email" type="email" placeholder="Email" required autofocus>
<input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></body></html>
