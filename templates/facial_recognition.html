<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darna - Facial Recognition</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:.8rem 1.2rem}header a{color:#89cff0}
main{padding:1rem 1.2rem;display:grid;gap:1rem;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;padding:1rem;display:grid;gap:.6rem;overflow-x:auto}
input,select,button{padding:.5rem;border:1px solid #cbd5e1;border-radius:8px}button{background:#89cff0;color:#0b3954;font-weight:600;border:0;cursor:pointer}button:hover{background:#6bbfe8}
table{border-collapse:collapse;font-size:.9rem}td,th{padding:.4rem;border-bottom:1px solid #e2e8f0;text-align:left}</style></head><body>
<header><a href="/">&larr; Dashboard</a> &middot; Facial Recognition</header><main>
<div class="card"><h3>Enroll authorized person (Property Manager)</h3>
<input id="en" placeholder="Full name"><select id="er"><option>Resident</option><option>Staff</option><option>Visitor</option></select>
<input id="ef" type="file" accept=".jpg,.jpeg,.png">
<label><input id="ec" type="checkbox"> The person has given explicit consent to biometric enrollment</label>
<button onclick="enroll()">Enroll</button><div id="em"></div></div>
<div class="card"><h3>Identify a face</h3>
<select id="cam"><option value="">No camera</option>{% for c in cameras %}<option value="{{ c.id }}">{{ c.name }} - {{ c.location }}</option>{% endfor %}</select>
<input id="if" type="file" accept=".jpg,.jpeg,.png"><button onclick="identify()">Identify</button><div id="im"></div>
<small>Results are suggestions only: a human must review every match before granting or denying access.</small></div>
<div class="card"><h3>Recent access events</h3><table id="ev"></table></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function send(url,fd,out){out.textContent='Working...';
 const r=await fetch(url,{method:'POST',body:fd});const j=await r.json().catch(()=>({}));
 out.textContent=j.error||(j.message+(j.similarity!=null?` (similarity ${j.similarity}, manual review required)`:''));events()}
const enroll=()=>{const f=new FormData();f.append('full_name',$('en').value);f.append('access_role',$('er').value);
 f.append('consent',$('ec').checked?'yes':'no');if($('ef').files[0])f.append('face_image',$('ef').files[0]);send('/api/facial/enroll',f,$('em'))};
const identify=()=>{const f=new FormData();if($('cam').value)f.append('camera_id',$('cam').value);
 if($('if').files[0])f.append('face_image',$('if').files[0]);send('/api/facial/identify',f,$('im'))};
async function events(){const r=await fetch('/api/facial/events');if(!r.ok){$('ev').innerHTML='<tr><td>Not permitted.</td></tr>';return}
 const d=await r.json();$('ev').innerHTML='<tr><th>Time</th><th>Result</th><th>Person</th><th>Camera</th><th>Similarity</th></tr>'+
 d.map(e=>`<tr><td>${esc(e.event_time)}</td><td>${esc(e.event_type)}</td><td>${esc(e.full_name)}</td><td>${esc(e.camera)}</td><td>${e.confidence==null?'':e.confidence.toFixed(2)}</td></tr>`).join('')}
events();
</script></body></html>
